<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/logo_ofertis.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ofertis Chile - El buscador de ofertas que alimenta tu ahorro</title>
    <script>
      try {
        if (localStorage.getItem('ofertis_theme') === 'dark' || (!localStorage.getItem('ofertis_theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (_) {}
    </script>
  </head>
  <body class="bg-stone-50 text-stone-900 dark:bg-stone-950 dark:text-stone-100 font-sans antialiased min-h-screen transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
