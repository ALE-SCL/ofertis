services:
  - type: web
    name: ofertis-backend
    env: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromDatabase:
          name: ofertis-db
          property: connectionString

databases:
  - name: ofertis-db
    plan: free
    databaseName: ofertis_db
    user: ofertis_user
