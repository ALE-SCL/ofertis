name: CD Pipeline - Production Deployment

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-package:
    name: Build & Package Production Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Backend Container
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: ofertis-backend:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Production Frontend Container
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: ofertis-frontend:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
